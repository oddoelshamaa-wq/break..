<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>تحدي الأفلام - نظام البريك المطور</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root { 
            --primary: #6366f1; --secondary: #22c55e; --bg: #0f172a; 
            --card: #1e293b; --text: #ffffff; --accent: #f472b6; --danger: #ef4444;
            --safe-bottom: env(safe-area-inset-bottom);
        }

        /* قفل اللعبة على الكمبيوتر */
        #mobile-only-warning {
            display: none; position: fixed; inset: 0; background: var(--bg);
            z-index: 9999; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 20px;
        }
        @media (min-width: 768px) { #mobile-only-warning { display: flex; } body { overflow: hidden; } }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: manipulation; }
        body { background: var(--bg); color: var(--text); margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        #lobby { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .lobby-box { background: var(--card); padding: 25px; border-radius: 24px; width: 100%; max-width: 320px; box-shadow: 0 20px 50px rgba(0,0,0,0.4); }
        
        input { width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 12px; border: 2px solid #334155; background: #0f172a; color: white; text-align: center; font-size: 16px !important; }

        .header { background: #1e293b; padding: 12px 15px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .game-area { flex: 1; padding: 10px; display: flex; flex-direction: column; overflow: hidden; }
        .emoji-box { background: var(--card); padding: 20px 10px; border-radius: 20px; font-size: 3.5rem; text-align: center; margin-bottom: 10px; }
        
        .feed-container { flex: 1; background: rgba(0,0,0,0.2); border-radius: 15px; padding: 10px; overflow-y: auto; display: flex; flex-direction: column-reverse; gap: 8px; border: 1px solid #334155; }
        .msg { padding: 10px; border-radius: 10px; font-size: 0.9rem; }
        .msg.correct { background: rgba(34, 197, 94, 0.2); border: 1px solid var(--secondary); color: #4ade80; }
        .msg.wrong { background: rgba(255,255,255,0.05); }

        .admin-panel { background: #1e293b; padding: 10px; display: none; gap: 5px; border-top: 1px solid #334155; }
        .adm-btn { flex: 1; padding: 10px 5px; border-radius: 8px; border: none; color: white; font-size: 0.75rem; font-weight: bold; }

        .input-bar { background: var(--card); padding: 10px 10px calc(10px + var(--safe-bottom)); display: flex; gap: 8px; border-top: 1px solid #334155; }
        .send-btn { background: var(--primary); color: white; border: none; padding: 0 15px; border-radius: 12px; font-weight: bold; }
        .send-btn:disabled { background: #334155; opacity: 0.5; }

        #global-scores-overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.98); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .scores-card { background: var(--card); width: 90%; border-radius: 24px; padding: 20px; }
        
        /* واجهة المنع */
        #access-denied { display:none; position:fixed; inset:0; background:var(--bg); z-index:10000; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px; }
    </style>
</head>
<body>

    <div id="mobile-only-warning">
        <div style="font-size: 50px;">📱</div>
        <h2>عذراً، هذه اللعبة للموبايل فقط!</h2>
    </div>

    <!-- رسالة رفض الدخول -->
    <div id="access-denied">
        <div style="font-size: 60px;">🛑</div>
        <h2 style="color:var(--danger)">عفواً، البريك غير مفعل!</h2>
        <p>لا يمكنك دخول اللعبة حالياً لأنك لست في فترة بريك.</p>
        <button onclick="location.reload()" style="padding:12px 30px; background:var(--primary); color:white; border:none; border-radius:10px;">إعادة محاولة</button>
    </div>

    <div id="lobby">
        <div class="lobby-box">
            <h2 style="margin-top:0; text-align:center;">🎬 خمن الفيلم</h2>
            <input type="text" id="user-name" placeholder="أدخل اسمك..." maxlength="15">
            <button id="create-btn" onclick="createRoom()" style="width:100%; padding:15px; background:var(--primary); color:white; border:none; border-radius:12px; margin-bottom:10px; font-weight:bold;">إنشاء غرفة</button>
            <input type="number" id="room-input" placeholder="كود الغرفة..." inputmode="numeric">
            <button id="join-btn" onclick="joinRoom()" style="width:100%; padding:15px; background:var(--secondary); color:white; border:none; border-radius:12px; font-weight:bold;">انضمام</button>
        </div>
    </div>

    <div id="game-screen" style="display:none; flex-direction:column; height:100vh;">
        <div class="header">
            <div id="display-code" style="font-size:12px; color:#94a3b8">#----</div>
            <div style="font-weight:bold; font-size:14px;">🎬 تحدي الأفلام</div>
            <div onclick="location.reload()" style="color:var(--danger); font-size:14px; font-weight:bold;">خروج</div>
        </div>

        <div class="game-area">
            <div id="status-banner" style="display:none; padding:10px; border-radius:10px; text-align:center; font-size:13px; margin-bottom:10px; font-weight:bold;"></div>
            <div class="emoji-box" id="emoji-display">⏳</div>
            <div id="movie-count" style="text-align:center; font-size:12px; color:#64748b; margin-bottom:10px;"></div>
            <div class="feed-container" id="feed"></div>
        </div>

        <div class="admin-panel" id="admin-tools">
            <button class="adm-btn" style="background:#475569" onclick="nextQuestion()">التالي ➡️</button>
            <button class="adm-btn" style="background:var(--primary)" onclick="toggleGlobalResults(true)">النتائج 📊</button>
            <button class="adm-btn" style="background:var(--accent)" onclick="revealToAll()">كشف الحل 👁️</button>
        </div>

        <div class="input-bar" id="bottom-bar">
            <input type="text" id="user-answer" style="margin-bottom:0" placeholder="اسم الفيلم..." autocomplete="off">
            <button class="send-btn" id="send-btn" onclick="submitAttempt()">إرسال</button>
        </div>
    </div>

    <div id="global-scores-overlay">
        <div class="scores-card">
            <h3 style="text-align:center; margin-top:0;">🏆 قائمة المتصدرين</h3>
            <div id="scores-list" style="max-height:300px; overflow-y:auto;"></div>
            <div id="admin-close-btn" style="display:none">
                <button onclick="toggleGlobalResults(false)" style="width:100%; padding:12px; background:var(--danger); color:white; border:none; border-radius:12px; margin-top:15px;">إغلاق عند الجميع</button>
            </div>
            <p id="player-wait-msg" style="text-align:center; color:#94a3b8; font-size:12px; margin-top:10px;">انتظر المشرف لبدء الدور التالي...</p>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAD0YJCv4EW8iaceUgnZkbXyI1MSNhQ3fc",
            authDomain: "brak-nagaf-v2.firebaseapp.com",
            databaseURL: "https://brak-nagaf-v2-default-rtdb.firebaseio.com",
            projectId: "brak-nagaf-v2",
            storageBucket: "brak-nagaf-v2.firebasestorage.app",
            messagingSenderId: "637473406996",
            appId: "1:637473406996:web:4c6538e86dee9cb4c72701"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myName = "", roomID = null, isAdmin = false;
        let serverOpen = false; 
        let myBreakActive = false;

        // دالة لفحص صلاحية الدخول قبل البدء
        async function checkPermission(name) {
            // 1. فحص هل السيرفر مفتوح للكل
            const globalSnap = await db.ref('serverSettings/globalOpen').once('value');
            const isGlobal = globalSnap.val() || false;

            // 2. فحص هل الشخص عنده بريك خاص
            const userSnap = await db.ref(`userBreaks/${name}`).once('value');
            const hasBreak = userSnap.val() || false;

            return (isGlobal || hasBreak);
        }

        async function createRoom() {
            myName = document.getElementById('user-name').value.trim().toLowerCase();
            if(!myName) return alert("اكتب اسمك أولاً");
            
            // الأدمن دائماً يدخل ليتمكن من إدارة الغرفة
            roomID = Math.floor(1000 + Math.random() * 9000);
            isAdmin = true;
            const playlist = Array.from(Array(movies.length).keys()).sort(() => Math.random() - 0.5);
            db.ref('rooms/' + roomID).set({ admin: myName, currentIndex: 0, playlist: playlist, isLocked: false, showScores: false }).then(() => start());
        }

        async function joinRoom() {
            const nameInput = document.getElementById('user-name').value.trim().toLowerCase();
            const idInput = document.getElementById('room-input').value.trim();
            
            if(!nameInput || !idInput) return alert("أكمل بياناتك");

            // فحص الغرفة أولاً
            const roomSnap = await db.ref('rooms/' + idInput).once('value');
            if(!roomSnap.exists()) return alert("الغرفة غير موجودة");

            const roomData = roomSnap.val();
            const isRoomAdmin = (roomData.admin === nameInput);

            // إذا لم يكن الأدمن، افحص البريك
            if(!isRoomAdmin) {
                const allowed = await checkPermission(nameInput);
                if(!allowed) {
                    document.getElementById('lobby').style.display = 'none';
                    document.getElementById('access-denied').style.display = 'flex';
                    return;
                }
            }

            myName = nameInput;
            roomID = idInput;
            isAdmin = isRoomAdmin;
            start();
        }

        function start() {
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('access-denied').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            document.getElementById('display-code').innerText = "#" + roomID;
            if(isAdmin) {
                document.getElementById('admin-tools').style.display = 'flex';
                document.getElementById('admin-close-btn').style.display = 'block';
                document.getElementById('player-wait-msg').style.display = 'none';
            }
            db.ref(`rooms/${roomID}/scores/${myName}`).transaction(s => s || 0);
            listen();
        }

        function listen() {
            // مراقبة البريك بشكل لحظي (لو قفل وهو شغال)
            db.ref('serverSettings/globalOpen').on('value', snap => { serverOpen = snap.val() || false; checkAccess(); });
            db.ref(`userBreaks/${myName}`).on('value', snap => { myBreakActive = snap.val() || false; checkAccess(); });

            const rRef = db.ref('rooms/' + roomID);
            rRef.on('value', snap => {
                const room = snap.val();
                if(!room) return;

                const movie = movies[room.playlist[room.currentIndex]];
                document.getElementById('emoji-display').innerText = movie.e;
                document.getElementById('movie-count').innerText = `الفيلم ${room.currentIndex + 1} من ${room.playlist.length}`;

                const overlay = document.getElementById('global-scores-overlay');
                overlay.style.display = room.showScores ? 'flex' : 'none';
                if(room.showScores) updateScoresUI(room.scores);

                const banner = document.getElementById('status-banner');
                if(room.isLocked) {
                    banner.style.display = 'block';
                    banner.style.background = room.winner ? "var(--secondary)" : "var(--accent)";
                    banner.innerText = room.winner ? `🎉 فاز ${room.winner}: ${movie.a}` : `👁️ الحل: ${movie.a}`;
                } else {
                    banner.style.display = 'none';
                }
                
                checkAccess(room.isLocked || room.showScores);
            });

            db.ref(`rooms/${roomID}/guesses`).limitToLast(20).on('child_added', snap => {
                const g = snap.val();
                const feed = document.getElementById('feed');
                const div = document.createElement('div');
                div.className = `msg ${g.isCorrect ? 'correct' : 'wrong'}`;
                div.innerHTML = `<b>${g.user}:</b> ${g.text} ${g.isCorrect ? '✅' : '❌'}`;
                feed.prepend(div);
            });
        }

        function checkAccess(forceLock = false) {
            // لو الشخص مش أدمن وانتهى البريك وهو جوه اللعبة، نخرجه
            if (!isAdmin && !serverOpen && !myBreakActive) {
                document.getElementById('game-screen').style.display = 'none';
                document.getElementById('access-denied').style.display = 'flex';
                return;
            }

            const input = document.getElementById('user-answer');
            const btn = document.getElementById('send-btn');
            
            if (forceLock) {
                input.disabled = true;
                btn.disabled = true;
                input.placeholder = "انتظر الدور التالي...";
            } else {
                input.disabled = false;
                btn.disabled = false;
                input.placeholder = "اسم الفيلم...";
            }
        }

        // --- باقي دوال اللعبة والأفلام (نفس الكود السابق) ---
        const movies = [
            { e: "🐘 🔵", a: "الفيل الازرق" }, { e: "👨‍🏫 🏫 🍎", a: "الناظر" },
            { e: "🚢 🧊 💔", a: "تيتانيك" }, { e: "🦁 👑", a: "الاسد الملك" },
            { e: "🏢 👮‍♂️ 👮‍♂️", a: "الخلية" }, { e: "🏝️ 👮‍♂️ 🔫", a: "الجزيرة" },
            { e: "👳‍♂️ 🏫 📚", a: "صعيدي في الجامعة الامريكية" }, { e: "⚡ 👓 🪄", a: "هاري بوتر" },
            { e: "🥊 👨‍🦲 🐴", a: "بوحه" }, { e: "🍳 👨‍🍳 🐭", a: "خلطبيطة بالصلصة" },
            { e: "🤡 🎈", a: "ات" }, { e: "🚢 🤣 👮‍♂️", a: "امير البحار" },
            { e: "🕵️‍♂️ 🇮🇹", a: "كازابلانكا" }, { e: "👨‍👩‍👧‍👦 🏠 👻", a: "الانس والنمس" },
            { e: "👮‍♂️ 🏫 👨‍👩‍👧‍👦", a: "الباشا تلميذ" }, { e: "👳‍♂️ 🏦 💰", a: "طير انت" },
            { e: "🏎️ 👨‍👩‍👧‍👦", a: "فول الصين العظيم" }, { e: "👨‍🦱 🕶️ 🦅", a: "اتش دبور" },
            { e: "🥊 🐴 🥩", a: "اللمبي" }, { e: "🕵️‍♂️ 📱 🕵️‍♂️", a: "ولاد رزق" },
            { e: "🏨 🧟‍♂️", a: "حملة فرعون" }, { e: "👨‍🏫 🤣", a: "مدرسة المشاغبين" },
            { e: "🍔 🍕 🐘", a: "اكس لارج" }, { e: "✈️ 🇪🇬 🕶️", a: "عسل اسود" },
            { e: "👔 💼 🤣", a: "مرجان احمد مرجان" }, { e: "🤵 👰 🔪", a: "افواه وارانب" },
            { e: "🪖 🇬🇧 🇪🇬", a: "كيرة والجن" }, { e: "👴 👴 👴 🏖️", a: "وقفة رجالة" },
            { e: "🧠 🖐️ 🤣", a: "مش انا" }, { e: "💡 🏃‍♂️ 🤣", a: "واحد تاني" },
            { e: "✈️ 🏝️ 💃", a: "لف ودوران" }, { e: "🏢 🏗️ 🤣", a: "مطب صناعي" },
            { e: "🧔 🔫 🤣", a: "جعلتني مجرما" }, { e: "🍔 📻 🤣", a: "ظرف طارق" },
            { e: "🧠 👨‍🎨 ✈️", a: "اسف على الازعاج" }, { e: "🕺 🕺 🕺 ⏳", a: "سمير وشهير وبهير" },
            { e: "🛵 🇮🇹 🍕", a: "همام في امستردام" }, { e: "🏍️ 🥖 👮‍♂️", a: "ابو علي" },
            { e: "👮‍♂️ 🤵 🤣", a: "البدلة" }, { e: "⚔️ 🦁 🏹", a: "الناصر صلاح الدين" },
            { e: "👦 👦 👦", a: "كده رضا" }, { e: "⚖️ 👨‍⚖️ 🏢", a: "ضد الحكومة" },
            { e: "🐍 🪜", a: "السلم والثعبان" }, { e: "👮‍♂️ 👩‍🔬 ❤️", a: "تيمور وشفيقة" },
            { e: "🧛‍♂️ 🦇 🩸", a: "خط دم" }, { e: "🕯️ 👻 🏫", a: "وردة" },
            { e: "👨‍💼 💼 🕋", a: "بوحة" }, { e: "🐪 🏜️ 🤣", a: "شورت وفانلة وكاب" },
            { e: "👨 💍 👩", a: "سهر الليالي" }, { e: "🚖 🤣 👮‍♂️", a: "ليلة سقوط بغداد" },
            { e: "🎻 🎼 💔", a: "الكيت كات" }, { e: "🏛️ 🕵️‍♂️ 🏺", a: "كنز الدولة" },
            { e: "🥊 🏋️‍♂️ 🤣", a: "حلم العمر" }, { e: "🎭 🤡 🔫", a: "الفرح" },
            { e: "🏟️ ⚽ 🤣", a: "العالمي" }, { e: "🏙️ 🏗️ 🏢", a: "كباريه" },
            { e: "👰 🤵 🚌", a: "يا انا يا خالتي" }, { e: "🕶️ 🚬 👮‍♂️", a: "تيتو" },
            { e: "🪖 🇪🇬 ⚔️", a: "الممر" }, { e: "🦁 👑 🌅", a: "الاسد الملك" }
        ];

        document.getElementById('user-answer').addEventListener('keypress', (e) => { if (e.key === 'Enter') submitAttempt(); });
        function submitAttempt() {
            if (!serverOpen && !myBreakActive && !isAdmin) return;
            const input = document.getElementById('user-answer');
            const ans = input.value.trim();
            if(!ans) return;
            db.ref('rooms/' + roomID).once('value', s => {
                const room = s.val();
                if(room.isLocked || room.showScores) return;
                const correct = movies[room.playlist[room.currentIndex]].a;
                const isCorrect = (normalize(ans) === normalize(correct));
                db.ref(`rooms/${roomID}/guesses`).push({ user: myName, text: ans, isCorrect: isCorrect });
                if(isCorrect) {
                    db.ref(`rooms/${roomID}`).update({ isLocked: true, winner: myName });
                    db.ref(`rooms/${roomID}/scores/${myName}`).transaction(p => (p || 0) + 1);
                }
                input.value = "";
            });
        }
        function updateScoresUI(scores) {
            const list = document.getElementById('scores-list');
            list.innerHTML = "";
            Object.entries(scores || {}).sort((a,b) => b[1] - a[1]).forEach(([name, pts]) => {
                list.innerHTML += `<div style="display:flex; justify-content:space-between; padding:12px; border-bottom:1px solid #334155;"><span>${name}</span> <b>${pts} نقطة</b></div>`;
            });
        }
        function toggleGlobalResults(show) { db.ref(`rooms/${roomID}`).update({ showScores: show }); }
        function revealToAll() { db.ref(`rooms/${roomID}`).update({ isLocked: true, revealed: true }); }
        function nextQuestion() {
            db.ref(`rooms/${roomID}`).update({ currentIndex: firebase.database.ServerValue.increment(1), isLocked: false, winner: null, revealed: false, showScores: false, guesses: null });
            document.getElementById('feed').innerHTML = "";
        }
        function normalize(s) { return s.replace(/[أآإ]/g, "ا").replace(/ة/g, "ه").replace(/\s+/g, '').trim(); }
    </script>
</body>
</html>
