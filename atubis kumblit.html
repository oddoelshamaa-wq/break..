<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أتوبيس كومبليت - نظام الأكواد</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        :root { --bg: #0f1221; --card: #1c2135; --primary: #5851db; --accent: #ffeb3b; --text: #fff; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 480px; background: var(--card); border-radius: 30px; padding: 25px; box-shadow: 0 0 30px rgba(0,0,0,0.5); text-align: center; border: 1px solid #3f51b5; position: relative; overflow: hidden; display: none; }
        .hidden { display: none !important; }
        
        #waitOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 18, 33, 0.95); z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        .letter-box { border: 2px solid var(--accent); border-radius: 20px; padding: 25px; margin: 15px 0; background: rgba(255,255,255,0.03); }
        .letter-box span { font-size: 80px; font-weight: bold; color: var(--accent); display: block; }
        
        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .input-item { background: #1e243a; border: 1px solid #323a54; border-radius: 12px; padding: 15px; color: white; text-align: center; font-size: 16px; outline: none; width: 100%; box-sizing: border-box; }
        .input-item:disabled { background: #0f1221; color: #8892b0; border-color: #222; }
        
        .btn { width: 100%; padding: 15px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-bottom: 10px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-admin { background: #27ae60; color: white; }
        .btn:disabled { background: #333; cursor: not-allowed; }
        
        .room-info { background: #2d344b; padding: 10px; border-radius: 10px; margin-bottom: 15px; cursor: pointer; }
        .scoreboard { background: #14192d; border-radius: 15px; padding: 15px; margin-top: 20px; text-align: right; }
        .score-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #2d344b; }
        
        .review-card { background: #252b42; padding: 15px; border-radius: 15px; margin-bottom: 15px; text-align: right; border: 1px solid var(--accent); }
        .points-btns button { padding: 8px 12px; margin-right: 5px; cursor: pointer; border-radius: 5px; border: none; font-weight: bold; color: white; }

        #mobileOnlyScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f1221; z-index: 99999; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; color: white; padding: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div id="waitOverlay" class="hidden">
        <h1 style="color: var(--accent);">🛑 STOP 🛑</h1>
        <p id="waitMsg">انتهى الوقت! المشرف يقوم بتصحيح الإجابات الآن...</p>
    </div>

    <div id="loginScreen">
        <h2>🚌 أتوبيس كومبليت</h2>
        <input type="text" id="userName" class="input-item" style="margin-bottom:20px;" placeholder="أدخل اسمك هنا...">
        <div style="background: rgba(255,255,255,0.05); padding: 20px; border-radius: 20px;">
            <p>أنت المشرف؟</p>
            <button class="btn btn-primary" onclick="setupRoom(true)">إنشاء غرفة جديدة</button>
            <hr style="border: 0.5px solid #333; margin: 20px 0;">
            <p>لديك كود؟</p>
            <input type="text" id="roomCodeInput" class="input-item" placeholder="أدخل كود الغرفة..." style="margin-bottom:10px; text-transform: uppercase;">
            <button class="btn btn-admin" onclick="setupRoom(false)">انضمام للعب</button>
        </div>
    </div>

    <div id="gameScreen" class="hidden">
        <div id="roomDisplay" class="room-info" onclick="copyCode()">
            <small>كود الغرفة (اضغط للنسخ):</small>
            <div id="displayCode" style="font-weight: bold; font-size: 22px; color: var(--accent);">----</div>
        </div>

        <div id="adminPanel" class="hidden">
            <button class="btn btn-admin" id="newLetterBtn" onclick="newLetter()">🎲 سحب حرف جديد</button>
        </div>
        
        <div class="letter-box">
            <div style="color:#8892b0">الحرف الحالي</div>
            <span id="currentLetter">؟</span>
        </div>

        <div class="grid-inputs">
            <input type="text" class="input-item iv" id="v0" placeholder="إنسان">
            <input type="text" class="input-item iv" id="v1" placeholder="حيوان">
            <input type="text" class="input-item iv" id="v2" placeholder="نبات">
            <input type="text" class="input-item iv" id="v3" placeholder="جماد">
            <input type="text" class="input-item iv" id="v4" placeholder="بلد">
            <input type="text" class="input-item iv" id="v5" placeholder="أكلة">
        </div>

        <button class="btn btn-primary" id="stopBtn" onclick="triggerStop()" disabled>أتوبيس كومبليت! 🚌</button>

        <div class="scoreboard">
            <h4 style="margin:0 0 10px 0; color:var(--accent)">📊 لوحة النتائج</h4>
            <div id="scoreRows"></div>
        </div>
    </div>

    <div id="adminReview" class="hidden">
        <h3 style="color:var(--accent)">🧐 تصحيح الإجابات</h3>
        <div id="reviewList"></div>
        <button class="btn btn-admin" onclick="backToGameUI()">إغلاق التصحيح</button>
    </div>
</div>

<div id="mobileOnlyScreen">
    <div style="font-size: 70px;">⚠️</div>
    <h2 style="color: #ffeb3b;">عذراً.. اللعبة للموبايل فقط!</h2>
</div>

<script>
    // --- إعدادات Firebase ---
    const firebaseConfig = {
        apiKey: "AIzaSyAD0YJCv4EW8iaceUgnZkbXyI1MSNhQ3fc",
        authDomain: "brak-nagaf-v2.firebaseapp.com",
        databaseURL: "https://brak-nagaf-v2-default-rtdb.firebaseio.com",
        projectId: "brak-nagaf-v2",
        storageBucket: "brak-nagaf-v2.firebasestorage.app",
        messagingSenderId: "637473406996",
        appId: "1:637473406996:web:4c6538e86dee9cb4c72701",
        measurementId: "G-82VDNF5M0L"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- نظام الحماية والبريك ---
    function isMobileDevice() { return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent); }
    
    function checkAccess() {
        const username = localStorage.getItem('break_sys_user');
        const container = document.querySelector('.container');
        if (!isMobileDevice()) { document.getElementById('mobileOnlyScreen').style.display = 'flex'; return; }
        if (!username) { document.body.innerHTML = "<h2 style='color:white;text-align:center;'>سجل دخول أولاً</h2>"; return; }

        db.ref('users/' + username).on('value', (snap) => {
            const user = snap.val();
            const managers = ['mahmoud', 'bo', 'ahmed'];
            if (managers.includes(username) || (user && user.isOnBreak)) {
                container.style.display = 'block';
            } else {
                document.body.innerHTML = "<h2 style='color:white;text-align:center;'>افتح بريك أولاً من السيستم</h2>";
            }
        });
    }
    checkAccess();

    // --- منطق اللعبة ---
    let peer, conn, myName, isHost = false, currentRoomCode = "";
    let connections = [];
    let players = {}; 
    const alphabet = "أبتثجحخدذرزسشصضطظعغفقكلمنهوي".split("");
    let roundActive = false;

    function setupRoom(hostMode) {
        myName = document.getElementById('userName').value.trim();
        if(!myName) return alert("ادخل اسمك");
        isHost = hostMode;
        
        if(isHost) {
            currentRoomCode = Math.random().toString(36).substring(2, 7).toUpperCase();
            peer = new Peer(currentRoomCode);
            peer.on('open', id => {
                document.getElementById('displayCode').innerText = id;
                players[id] = {name: myName, score: 0};
                document.getElementById('adminPanel').classList.remove('hidden');
                showGameUI();
                updateUI();
            });
            peer.on('connection', c => {
                connections.push(c);
                c.on('data', data => handleData(data, c));
            });
        } else {
            currentRoomCode = document.getElementById('roomCodeInput').value.trim().toUpperCase();
            peer = new Peer();
            peer.on('open', id => {
                conn = peer.connect(currentRoomCode);
                conn.on('open', () => {
                    conn.send({type:'join', name:myName});
                    document.getElementById('displayCode').innerText = currentRoomCode;
                    showGameUI();
                });
                conn.on('data', data => handleData(data));
            });
        }
    }

    function handleData(data, sender) {
        if(data.type === 'join' && isHost) {
            players[sender.peer] = {name: data.name, score: 0};
            broadcast({type:'sync', players: players});
            updateUI();
        } 
        else if(data.type === 'sync') {
            players = data.players;
            updateUI();
        } 
        else if(data.type === 'letter') {
            startNewRound(data.val);
        } 
        else if(data.type === 'stop') {
            processStopAction();
        } 
        else if(data.type === 'submit' && isHost) {
            showReviewItem(sender.peer, data.name, data.answers);
        }
        else if(data.type === 'reset_ui') {
            document.getElementById('waitOverlay').classList.add('hidden');
        }
    }

    function broadcast(msg) {
        connections.forEach(c => c.send(msg));
    }

    function startNewRound(letter) {
        roundActive = true;
        document.getElementById('waitOverlay').classList.add('hidden');
        document.getElementById('currentLetter').innerText = letter;
        resetInputs();
        document.getElementById('stopBtn').disabled = false;
    }

    function newLetter() {
        if(!isHost) return;
        const char = alphabet[Math.floor(Math.random() * alphabet.length)];
        broadcast({type: 'reset_ui'});
        broadcast({type: 'letter', val: char});
        startNewRound(char);
    }

    function triggerStop() {
        if(!roundActive) return;
        if(isHost) {
            processStopAction();
        } else {
            conn.send({type: 'stop'});
        }
    }

    function processStopAction() {
        roundActive = false;
        lockInputs();
        
        if(isHost) {
            broadcast({type: 'stop'});
            // أضف إجابات المشرف نفسه للتصحيح
            showReviewItem(peer.id, myName, getInputs());
        } else {
            document.getElementById('waitOverlay').classList.remove('hidden');
            conn.send({type: 'submit', name: myName, answers: getInputs()});
        }
    }

    function showReviewItem(id, pName, answers) {
        const reviewList = document.getElementById('reviewList');
        document.getElementById('adminReview').classList.remove('hidden');
        const labels = ["إنسان", "حيوان", "نبات", "جماد", "بلد", "أكلة"];
        
        const div = document.createElement('div');
        div.className = 'review-card';
        div.innerHTML = `<b>اللاعب: ${pName}</b><br><br>`;
        answers.forEach((ans, i) => {
            div.innerHTML += `<div style="margin-bottom:10px;">${labels[i]}: ${ans || '---'} 
                <span class="points-btns">
                    <button onclick="addPoints('${id}',10,this)" style="background:#2ecc71">10</button>
                    <button onclick="addPoints('${id}',5,this)" style="background:#f1c40f;color:#000">5</button>
                    <button onclick="addPoints('${id}',0,this)" style="background:#e74c3c">0</button>
                </span></div>`;
        });
        reviewList.appendChild(div);
    }

    function addPoints(id, pts, btn) {
        if(players[id]) {
            players[id].score += pts;
            btn.parentElement.innerHTML = " ✅ " + pts;
            updateUI();
            broadcast({type:'sync', players: players});
        }
    }

    function backToGameUI() {
        document.getElementById('adminReview').classList.add('hidden');
        document.getElementById('reviewList').innerHTML = "";
    }

    function updateUI() {
        const list = document.getElementById('scoreRows');
        list.innerHTML = "";
        Object.values(players).sort((a,b) => b.score - a.score).forEach(p => {
            list.innerHTML += `<div class="score-row"><span>${p.name}</span><span>${p.score} نقطة</span></div>`;
        });
    }

    function getInputs() { 
        return [0,1,2,3,4,5].map(i => document.getElementById('v'+i).value.trim()); 
    }

    function lockInputs() { 
        document.querySelectorAll('.iv').forEach(el => el.disabled = true);
        document.getElementById('stopBtn').disabled = true;
    }

    function resetInputs() { 
        document.querySelectorAll('.iv').forEach(el => { el.disabled = false; el.value = ""; });
    }

    function showGameUI() { 
        document.getElementById('loginScreen').classList.add('hidden'); 
        document.getElementById('gameScreen').classList.remove('hidden'); 
    }

    function copyCode() {
        navigator.clipboard.writeText(currentRoomCode);
        alert("تم نسخ الكود");
    }
</script>
</body>
</html>
