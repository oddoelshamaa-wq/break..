<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>روم أفلام - نسخة الموبايل</title>
    <!-- استدعاء Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root { 
            --primary: #6366f1; 
            --secondary: #22c55e; 
            --bg: #0f172a; 
            --card: #1e293b; 
            --text: #ffffff;
            --accent: #f472b6;
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        /* منع نسخة الكمبيوتر */
        #pc-blocker {
            display: none;
            position: fixed; inset: 0; background: var(--bg); z-index: 9999;
            flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 20px;
        }

        /* واجهة الدخول */
        #lobby-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 20px; }
        .lobby-card { background: var(--card); padding: 30px; border-radius: 25px; width: 100%; max-width: 350px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px; border: 2px solid #334155; background: #0f172a; color: white; text-align: center; font-size: 1rem; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-create { background: var(--primary); color: white; margin-bottom: 10px; }
        .btn-join { background: var(--secondary); color: white; }

        /* واجهة اللعبة */
        #game-screen { display: none; flex-direction: column; height: 100%; }
        
        /* لوحة الصدارة (Scoreboard) */
        .header { background: #1e293b; padding: 10px; border-bottom: 2px solid #334155; }
        .scoreboard { 
            display: flex; 
            gap: 10px; 
            overflow-x: auto; 
            padding: 5px;
            min-height: 50px;
            align-items: center;
        }
        .score-card { 
            background: rgba(99, 102, 241, 0.2); 
            border: 1px solid var(--primary);
            padding: 5px 12px; 
            border-radius: 10px; 
            min-width: 70px; 
            text-align: center; 
        }
        .score-card .n { font-size: 0.7rem; color: #94a3b8; display: block; overflow: hidden; text-overflow: ellipsis; }
        .score-card .p { font-size: 1.1rem; font-weight: bold; color: #fff; }

        .game-area { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; }
        .emoji-display { background: var(--card); padding: 35px 10px; border-radius: 20px; font-size: 3.5rem; text-align: center; margin-bottom: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .movie-index { text-align: center; color: #64748b; font-size: 0.8rem; margin-bottom: 15px; }

        .feed { display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 12px; border-radius: 12px; background: rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; border-right: 4px solid #444; }
        .msg.correct { border-color: var(--secondary); background: rgba(34, 197, 94, 0.1); }
        .msg.wrong { border-color: #ef4444; }

        /* التحكم */
        .admin-panel { background: #1e293b; padding: 10px; display: none; gap: 8px; border-top: 1px solid #334155; }
        .adm-btn { flex: 1; padding: 12px; border-radius: 10px; border: none; color: white; font-weight: bold; font-size: 0.8rem; cursor: pointer; }
        
        .input-bar { background: var(--card); padding: 15px; display: flex; gap: 10px; padding-bottom: calc(15px + env(safe-area-inset-bottom)); }
        .game-input { flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; color: white; }
        .send-btn { background: var(--primary); color: white; border: none; padding: 0 20px; border-radius: 10px; font-weight: bold; }

    </style>
</head>
<body>

    <div id="pc-blocker">
        <h2>📱 عذراً!</h2>
        <p>هذه اللعبة مصممة للعمل على الهواتف فقط.</p>
    </div>

    <!-- الدخول -->
    <div id="lobby-screen">
        <div class="lobby-card">
            <h1 style="margin-bottom:20px">🎬 خمن الفيلم</h1>
            <input type="text" id="user-name" placeholder="اكتب اسمك هنا...">
            <button class="btn btn-create" onclick="createNewRoom()">إنشاء غرفة جديدة</button>
            <div style="margin:10px; color:#64748b">أو</div>
            <input type="number" id="room-code-input" placeholder="ادخل كود الغرفة...">
            <button class="btn btn-join" onclick="joinRoom()">انضمام للعب</button>
        </div>
    </div>

    <!-- اللعبة -->
    <div id="game-screen">
        <div class="header">
            <div style="display:flex; justify-content:space-between; font-size:0.7rem; color:#94a3b8; margin-bottom:5px">
                <span id="room-id-txt">كود: ----</span>
                <span onclick="location.reload()" style="color:#ef4444">خروج 🚪</span>
            </div>
            <div class="scoreboard" id="scoreboard">
                <!-- الدرجات تظهر هنا تلقائياً -->
            </div>
        </div>

        <div class="game-area">
            <div class="emoji-display" id="emoji-box">⏳</div>
            <div class="movie-index" id="movie-info">الفيلم 0 / 60</div>
            <div class="feed" id="feed-list"></div>
        </div>

        <div class="admin-panel" id="admin-controls">
            <button class="adm-btn" style="background:var(--accent)" onclick="revealResults()">👁️ كشف الحل</button>
            <button class="adm-btn" style="background:var(--secondary)" onclick="nextQuestion()">➡️ التالي</button>
            <button class="adm-btn" style="background:#64748b" onclick="resetAllScores()">🔄 تصفير</button>
        </div>

        <div class="input-bar">
            <input type="text" id="answer-input" class="game-input" placeholder="اكتب اسم الفيلم...">
            <button class="send-btn" onclick="sendAnswer()">إرسال</button>
        </div>
    </div>

    <script>
        // حظر الكمبيوتر
        if (!/Android|iPhone|iPad/i.test(navigator.userAgent)) {
            document.getElementById('pc-blocker').style.display = 'flex';
        }

        // إعدادات Firebase (ضع مفاتيحك هنا)
        const firebaseConfig = {
            apiKey: "AIzaSyAD0YJCv4EW8iaceUgnZkbXyI1MSNhQ3fc",
            authDomain: "brak-nagaf-v2.firebaseapp.com",
            databaseURL: "https://brak-nagaf-v2-default-rtdb.firebaseio.com",
            projectId: "brak-nagaf-v2",
            storageBucket: "brak-nagaf-v2.firebasestorage.app",
            messagingSenderId: "637473406996",
            appId: "1:637473406996:web:4c6538e86dee9cb4c72701"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentRoom = null;
        let myName = "";
        let isOwner = false;

           const movies = [
            { e: "🐘 🔵", a: "الفيل الازرق" }, { e: "👨‍🏫 🏫 🍎", a: "الناظر" },
            { e: "🚢 🧊 💔", a: "تيتانيك" }, { e: "🦁 👑", a: "الاسد الملك" },
            { e: "🏢 👮‍♂️ 👮‍♂️", a: "الخلية" }, { e: "🏝️ 👮‍♂️ 🔫", a: "الجزيرة" },
            { e: "👳‍♂️ 🏫 📚", a: "صعيدي في الجامعة الامريكية" }, { e: "⚡ 👓 🪄", a: "هاري بوتر" },
            { e: "🥊 👨‍🦲 🐴", a: "بوحه" }, { e: "🍳 👨‍🍳 🐭", a: "خلطبيطة بالصلصة" },
            { e: "🤡 🎈", a: "ات" }, { e: "🚢 🤣 👮‍♂️", a: "امير البحار" },
            { e: "🕵️‍♂️ 🇮🇹", a: "كازابلانكا" }, { e: "👨‍👩‍👧‍👦 🏠 👻", a: "الانس والنمس" },
            { e: "👮‍♂️ 🏫 👨‍👩‍👧‍👦", a: "الباشا تلميذ" }, { e: "👳‍♂️ 🏦 💰", a: "طير انت" },
            { e: "🏎️ 👨‍👩‍👧‍👦", a: "فول الصين العظيم" }, { e: "👨‍🦱 🕶️ 🦅", a: "اتش دبور" },
            { e: "🥊 🐴 🥩", a: "اللمبي" }, { e: "🕵️‍♂️ 📱 🕵️‍♂️", a: "ولاد رزق" },
            { e: "🏨 🧟‍♂️", a: "حملة فرعون" }, { e: "👨‍🏫 🤣", a: "مدرسة المشاغبين" },
            { e: "🍔 🍕 🐘", a: "اكس لارج" }, { e: "✈️ 🇪🇬 🕶️", a: "عسل اسود" },
            { e: "👔 💼 🤣", a: "مرجان احمد مرجان" }, { e: "🤵 👰 🔪", a: "افواه وارانب" },
            { e: "🪖 🇬🇧 🇪🇬", a: "كيرة والجن" }, { e: "👴 👴 👴 🏖️", a: "وقفة رجالة" },
            { e: "🧠 🖐️ 🤣", a: "مش انا" }, { e: "💡 🏃‍♂️ 🤣", a: "واحد تاني" },
            { e: "✈️ 🏝️ 💃", a: "لف ودوران" }, { e: "🏢 🏗️ 🤣", a: "مطب صناعي" },
            { e: "🧔 🔫 🤣", a: "جعلتني مجرما" }, { e: "🍔 📻 🤣", a: "ظرف طارق" },
            { e: "🧠 👨‍🎨 ✈️", a: "اسف على الازعاج" }, { e: "🕺 🕺 🕺 ⏳", a: "سمير وشهير وبهير" },
            { e: "🛵 🇮🇹 🍕", a: "همام في امستردام" }, { e: "🏍️ 🥖 👮‍♂️", a: "ابو علي" },
            { e: "👮‍♂️ 🤵 🤣", a: "البدلة" }, { e: "⚔️ 🦁 🏹", a: "الناصر صلاح الدين" },
            { e: "👦 👦 👦", a: "كده رضا" }, { e: "⚖️ 👨‍⚖️ 🏢", a: "ضد الحكومة" },
            { e: "🐍 🪜", a: "السلم والثعبان" }, { e: "👮‍♂️ 👩‍🔬 ❤️", a: "تيمور وشفيقة" },
            { e: "🧛‍♂️ 🦇 🩸", a: "خط دم" }, { e: "🕯️ 👻 🏫", a: "وردة" },
            { e: "👨‍💼 💼 🕋", a: "بوحة" }, { e: "🐪 🏜️ 🤣", a: "شورت وفانلة وكاب" },
            { e: "👨 💍 👩", a: "سهر الليالي" }, { e: "🚖 🤣 👮‍♂️", a: "ليلة سقوط بغداد" },
            { e: "🎻 🎼 💔", a: "الكيت كات" }, { e: "🏛️ 🕵️‍♂️ 🏺", a: "كنز الدولة" },
            { e: "🥊 🏋️‍♂️ 🤣", a: "حلم العمر" }, { e: "🎭 🤡 🔫", a: "الفرح" },
            { e: "🏟️ ⚽ 🤣", a: "العالمي" }, { e: "🏙️ 🏗️ 🏢", a: "كباريه" },
            { e: "👰 🤵 🚌", a: "يا انا يا خالتي" }, { e: "🕶️ 🚬 👮‍♂️", a: "تيتو" },
            { e: "🪖 🇪🇬 ⚔️", a: "الممر" }, { e: "🦁 👑 🌅", a: "الاسد الملك" }
        ];
        function createNewRoom() {
            myName = document.getElementById('user-name').value.trim();
            if(!myName) return alert("اكتب اسمك أولاً");
            const code = Math.floor(1000 + Math.random() * 9000);
            isOwner = true;
            db.ref('rooms/' + code).set({ admin: myName, currentIndex: 0 }).then(() => joinProcess(code));
        }

        function joinRoom() {
            myName = document.getElementById('user-name').value.trim();
            const code = document.getElementById('room-code-input').value.trim();
            if(!myName || !code) return alert("أكمل البيانات");
            db.ref('rooms/' + code).once('value', s => {
                if(s.exists()){
                    isOwner = (s.val().admin === myName);
                    joinProcess(code);
                } else alert("الغرفة غير موجودة");
            });
        }

        function joinProcess(code) {
            currentRoom = code;
            document.getElementById('lobby-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            document.getElementById('room-id-txt').innerText = "كود الغرفة: " + code;
            if(isOwner) document.getElementById('admin-controls').style.display = 'flex';
            
            listenToData();
        }

        function listenToData() {
            const rRef = db.ref('rooms/' + currentRoom);

            // تحديث لوحة الصدارة (النقاط) - هذا الجزء الذي سيعرض الدرجات
            rRef.child('scores').on('value', snap => {
                const sb = document.getElementById('scoreboard');
                sb.innerHTML = "";
                const data = snap.val();
                if(data) {
                    // تحويل الكائن لمصفوفة وترتيبها حسب النقاط
                    const sorted = Object.entries(data).sort((a,b) => b[1] - a[1]);
                    sorted.forEach(([name, pts]) => {
                        sb.innerHTML += `<div class="score-card">
                            <span class="n">${name}</span>
                            <span class="p">${pts}</span>
                        </div>`;
                    });
                } else {
                    sb.innerHTML = "<div style='color:#64748b; font-size:0.8rem'>لا توجد نقاط بعد...</div>";
                }
            });

            // تحديث السؤال
            rRef.child('currentIndex').on('value', snap => {
                const i = snap.val() || 0;
                if(movies[i]) {
                    document.getElementById('emoji-box').innerText = movies[i].e;
                    document.getElementById('movie-info').innerText = `الفيلم ${i+1} / ${movies.length}`;
                    document.getElementById('answer-input').value = "";
                    document.getElementById('answer-input').disabled = false;
                    document.getElementById('feed-list').innerHTML = "";
                }
            });

            // تحديث النتائج بعد كشف الأدمن
            rRef.child('lastResult').on('value', snap => {
                const res = snap.val();
                if(res) {
                    const list = document.getElementById('feed-list');
                    list.innerHTML = `<div style="text-align:center; color:var(--secondary); font-weight:bold; margin:10px 0">الحل: ${res.correct}</div>`;
                    res.answers.forEach(a => {
                        list.innerHTML += `<div class="msg ${a.isCorrect ? 'correct' : 'wrong'}">
                            <span><b>${a.user}:</b> ${a.text}</span>
                            <span>${a.isCorrect ? '✅' : '❌'}</span>
                        </div>`;
                    });
                }
            });
        }

        function sendAnswer() {
            const val = document.getElementById('answer-input').value.trim();
            if(!val) return;
            document.getElementById('answer-input').disabled = true;
            // حفظ الإجابة مؤقتاً في الروم ليراها الأدمن عند الكشف
            db.ref(`rooms/${currentRoom}/tempAnswers/${myName}`).set(val);
        }

        // وظائف الأدمن
        function revealResults() {
            db.ref('rooms/' + currentRoom).once('value', snap => {
                const room = snap.val();
                const correctText = movies[room.currentIndex].a;
                const tempAnswers = room.tempAnswers || {};
                const finalAnswers = [];

                Object.entries(tempAnswers).forEach(([user, text]) => {
                    const isCorrect = normalize(text) === normalize(correctText);
                    finalAnswers.push({ user, text, isCorrect });
                    
                    if(isCorrect) {
                        // تحديث النقاط في قاعدة البيانات
                        db.ref(`rooms/${currentRoom}/scores/${user}`).transaction(p => (p || 0) + 1);
                    }
                });

                db.ref(`rooms/${currentRoom}/lastResult`).set({
                    correct: correctText,
                    answers: finalAnswers
                });
            });
        }

        function nextQuestion() {
            db.ref(`rooms/${currentRoom}/currentIndex`).transaction(i => (i || 0) + 1);
            db.ref(`rooms/${currentRoom}/tempAnswers`).remove();
            db.ref(`rooms/${currentRoom}/lastResult`).remove();
        }

        function resetAllScores() {
            if(confirm("هل تريد تصفير جميع الدرجات؟")) {
                db.ref(`rooms/${currentRoom}/scores`).remove();
            }
        }

        function normalize(s) { 
            return s.replace(/[أآإ]/g, "ا").replace(/ة/g, "ه").replace(/\s+/g, '').trim().toLowerCase(); 
        }
    </script>
</body>
</html>
